spring.application.name=server
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Port Number (Render는 $PORT 주입, 로컬은 3000)
server.port=${PORT:3000}

# Database
spring.datasource.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/M-project
spring.datasource.hikari.username=postgres
spring.datasource.hikari.password=1234

# Gemini API — 키는 환경변수로 주입 (삭제된 키는 파일에서도 제거됨)
# 로컬: $env:GEMINI_API_KEY="새키" / Render: Environment에 GEMINI_API_KEY 등록
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-flash-latest}

